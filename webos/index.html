<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebOSFlux</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="nav-bar">
      <div class="nav-item">Inicio</div>
      <div class="nav-item">TV en vivo</div>
      <div class="nav-item">Películas</div>
      <div class="nav-item">Series</div>
      <div class="nav-item">Búsqueda</div>
      <div class="nav-item">Configuración</div>
    </div>
    
    <div id="content">
      <div id="screen-home" class="screen">
        <div class="screen-title">Inicio</div>
        <div id="grid-home" class="grid"></div>
      </div>
      
      <div id="screen-live" class="screen">
        <div class="screen-title">TV en vivo</div>
        <div id="grid-live" class="grid"></div>
      </div>
      
      <div id="screen-movies" class="screen">
        <div class="screen-title">Películas</div>
        <div id="grid-movies" class="grid"></div>
      </div>
      
      <div id="screen-series" class="screen">
        <div class="screen-title">Series</div>
        <div id="grid-series" class="grid"></div>
      </div>
      
      <div id="screen-search" class="screen">
        <div class="screen-title">Búsqueda</div>
        <input type="text" id="search-input" placeholder="Buscar...">
      </div>
      
      <div id="screen-config" class="screen">
        <div class="screen-title">Configuración</div>
        <div id="config-list">
          <div class="config-item">Versión: 1.0.0</div>
          <div class="config-item">Dispositivo: LG 43LM6300PDB</div>
          <div class="config-item">Datos de prueba</div>
        </div>
      </div>
      
      <div id="screen-player" class="screen">
        <video id="player" controls></video>
        <div id="player-info">Reproduciendo video de prueba (sin DRM)</div>
      </div>
    </div>
  </div>
  
  <script src="js/app.js"></script>
</body>
</html>
